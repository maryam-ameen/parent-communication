<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام التواصل مع أولياء الأمور</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:"Cairo",sans-serif;

direction:rtl;

text-align:center;

min-height:100vh;

overflow-x:hidden;

background-image:
linear-gradient(
rgba(255,255,255,0.285),
rgba(255,255,255,0.158)
),
url("https://lh3.googleusercontent.com/d/1EfrMWJS_ZlookD8ZiZE7krk_6x_bkwez");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

background-attachment:fixed;

}


/* الطبقة الرئيسية */

.overlay{

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:40px 20px;

}


/* الشعار */

.logo{

width:170px;

max-width:40vw;

margin-bottom:20px;

}


/* العنوان */

h1{

color:#1f3c88;

font-size:clamp(32px,6vw,72px);

line-height:1.3;

margin:0 0 30px 0;

padding:0 10px;

}


/* الصناديق */

.container,
.stats-container{

width:min(92vw,520px);

background:rgba(255,255,255,0.482);

padding:30px;

border-radius:28px;

box-shadow:0 10px 35px rgba(0,0,0,0.12);

backdrop-filter:blur(6px);

}

.stats-container{

margin-top:20px;

}


/* الحقول */

.search-box{

position:relative;

width:100%;

margin-bottom:18px;

}


.icon{

position:absolute;

right:16px;

top:50%;

transform:translateY(-50%);

font-size:18px;

color:#1f3c88;

z-index:5;

pointer-events:none;

}


/* الحقل */

input{

width:100%;

height:60px;

border-radius:16px;

border:1px solid #d7d7d7;

padding-right:50px;

padding-left:48px;

font-size:17px;

font-family:"Cairo",sans-serif;

background:white;

color:#333;

}


input:focus{

outline:none;

border-color:#1f3c88;

box-shadow:0 0 10px rgba(31,60,136,0.15);

}


/* =========================
   السهم العام
========================= */

.select-arrow{

position:absolute;

left:10px;

top:50%;

transform:translateY(-50%);

width:38px;

height:38px;

border:none;

background:transparent;

color:#1f3c88;

font-size:18px;

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

z-index:10;

margin:0;

padding:0;

box-shadow:none;

}


/* لا يتأثر السهم عند المرور عليه */

.select-arrow:hover{

background:transparent;

transform:translateY(-50%);

box-shadow:none;

}


/* =========================
   القوائم المخصصة
========================= */

.custom-dropdown{

display:none;

position:absolute;

top:66px;

right:0;

left:0;

background:white;

border:1px solid #ddd;

border-radius:16px;

box-shadow:0 10px 30px rgba(0,0,0,0.15);

z-index:9999;

overflow:hidden;

text-align:right;

}


.custom-dropdown.show{

display:block;

}


/* عناصر القوائم */

.dropdown-option{

padding:14px 18px;

font-size:16px;

cursor:pointer;

border-bottom:1px solid #f1f1f1;

background:white;

}


.dropdown-option:last-child{

border-bottom:none;

}


.dropdown-option:hover{

background:#f4f5ff;

}


.dropdown-option:active{

background:#eef0ff;

}


/* =========================
   قائمة الطالبات
========================= */

.student-dropdown{

top:66px;

}


.student-filter{

padding:10px;

border-bottom:1px solid #eee;

background:#fafafa;

}


.student-filter input{

height:48px;

padding:0 15px;

font-size:15px;

}


.student-list{

max-height:280px;

overflow-y:auto;

-webkit-overflow-scrolling:touch;

}


.student-option{

padding:13px 18px;

font-size:15px;

text-align:right;

cursor:pointer;

border-bottom:1px solid #f1f1f1;

background:white;

}


.student-option:hover{

background:#f4f5ff;

}


.student-option:active{

background:#eef0ff;

}


.no-students{

padding:20px;

font-size:14px;

color:#777;

text-align:center;

}


/* الزر */

button.send-button{

width:100%;

height:60px;

border:none;

border-radius:16px;

background:#1f3c88;

color:white;

font-size:20px;

font-family:"Cairo",sans-serif;

font-weight:bold;

cursor:pointer;

transition:0.25s;

margin-top:10px;

}


button.send-button:hover{

background:#6c3eb7;

transform:translateY(-2px);

box-shadow:0 8px 18px rgba(108,62,183,0.25);

}


/* رسائل اليوم */

.today-box{

background:#f8f8ff;

padding:18px;

border-radius:20px;

margin-bottom:18px;

font-size:22px;

font-weight:bold;

color:#1f3c88;

}


#today-count{

color:#6c3eb7;

font-size:34px;

}


/* الإحصائيات */

.stats-box{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:14px;

}


.stat-card{

background:#f8f8ff;

padding:18px 10px;

border-radius:18px;

box-shadow:0 5px 12px rgba(0,0,0,0.05);

}


.stat-card h3{

margin:0;

font-size:15px;

color:#1f3c88;

}


.stat-card p{

margin-top:10px;

font-size:30px;

font-weight:bold;

color:#6c3eb7;

}


/* الفوتر */

.footer{

margin-top:25px;

font-size:14px;

color:#444;

padding-bottom:15px;

}


/* =========================
   الجوال
========================= */

@media(max-width:600px){

.overlay{

padding:25px 14px;

}


.logo{

width:150px;

max-width:55vw;

margin-bottom:15px;

}


h1{

font-size:34px;

line-height:1.35;

margin-bottom:22px;

}


.container,
.stats-container{

width:94vw;

padding:22px;

border-radius:24px;

}


input{

height:56px;

font-size:16px;

}


button.send-button{

height:56px;

font-size:17px;

}


.select-arrow{

width:38px;

height:38px;

font-size:17px;

}


.custom-dropdown{

top:61px;

}


.student-dropdown{

top:61px;

}


.dropdown-option{

padding:13px 15px;

font-size:15px;

}


.student-list{

max-height:260px;

}


.student-option{

padding:13px 15px;

font-size:14px;

}


.stats-box{

grid-template-columns:1fr;

}

}


/* الشاشات الكبيرة */

@media(min-width:1400px){

.container,
.stats-container{

max-width:600px;

}


h1{

font-size:78px;

}

}

</style>

</head>


<body>


<div class="overlay">


<!-- الشعار -->

<img

src="https://lh3.googleusercontent.com/d/1M2HSqXpnuZrGR_KJFeiIypmAepALG9bh"

class="logo"

>


<!-- العنوان -->

<h1>

التواصل مع شركاء النجاح

</h1>


<!-- =========================
     صندوق الإرسال
========================= -->

<div class="container">


<!-- =========================
     المرحلة
========================= -->

<div class="search-box">

<span class="icon">📚</span>

<input

id="stage"

placeholder="اختاري المرحلة"

readonly

>


<button

type="button"

class="select-arrow"

id="stage-arrow"

>

▼

</button>


<div

class="custom-dropdown"

id="stage-dropdown"

>

<div

class="dropdown-option"

data-value="أول ثانوي"

>

أول ثانوي

</div>

<div

class="dropdown-option"

data-value="ثاني ثانوي"

>

ثاني ثانوي

</div>

<div

class="dropdown-option"

data-value="ثالث ثانوي"

>

ثالث ثانوي

</div>

</div>

</div>


<!-- =========================
     الطالبة
========================= -->

<div class="search-box student-picker">

<span class="icon">🔎</span>


<input

id="search"

placeholder="اكتبي اسم الطالبة أو اختاري من السهم"

autocomplete="off"

>


<button

type="button"

class="select-arrow"

id="student-arrow"

>

▼

</button>


<!-- قائمة الطالبات -->

<div

class="custom-dropdown student-dropdown"

id="student-dropdown"

>


<div class="student-filter">

<input

id="student-filter"

placeholder="ابحثي عن الطالبة"

autocomplete="off"

>

</div>


<div

class="student-list"

id="student-list"

>

<div class="no-students">

اختاري المرحلة أولاً

</div>

</div>


</div>

</div>


<!-- =========================
     سبب الإرسال
========================= -->

<div class="search-box">

<span class="icon">📩</span>

<input

id="type"

placeholder="اختاري سبب الإرسال"

readonly

>


<button

type="button"

class="select-arrow"

id="type-arrow"

>

▼

</button>


<div

class="custom-dropdown"

id="type-dropdown"

>

<div

class="dropdown-option"

data-value="غياب"

>

غياب

</div>

<div

class="dropdown-option"

data-value="تأخر"

>

تأخر

</div>

<div

class="dropdown-option"

data-value="شكر"

>

شكر

</div>

<div

class="dropdown-option"

data-value="مخالفة"

>

مخالفة

</div>

</div>

</div>


<!-- زر الإرسال -->

<button

class="send-button"

onclick="send()"

>

إرسال الرسالة

</button>


</div>


<!-- =========================
     الإحصائيات
========================= -->

<div class="stats-container">


<div class="today-box">

📅 رسائل اليوم:

<span id="today-count">

0

</span>

</div>


<div class="stats-box">


<div class="stat-card">

<h3>

أول ثانوي

</h3>

<p id="first-count">

0

</p>

</div>


<div class="stat-card">

<h3>

ثاني ثانوي

</h3>

<p id="second-count">

0

</p>

</div>


<div class="stat-card">

<h3>

ثالث ثانوي

</h3>

<p id="third-count">

0

</p>

</div>


</div>

</div>


<!-- الفوتر -->

<div class="footer">

متوسطة وثانوية الأندلس الأهلية بالطائف - بنات

</div>


</div>


<script>


/* =========================
   البيانات
========================= */

let students = [];


/* =========================
   العناصر
========================= */

const stageInput =

document.getElementById("stage");


const stageArrow =

document.getElementById("stage-arrow");


const stageDropdown =

document.getElementById("stage-dropdown");


const studentInput =

document.getElementById("search");


const studentArrow =

document.getElementById("student-arrow");


const studentDropdown =

document.getElementById("student-dropdown");


const studentFilter =

document.getElementById("student-filter");


const studentList =

document.getElementById("student-list");


const typeInput =

document.getElementById("type");


const typeArrow =

document.getElementById("type-arrow");


const typeDropdown =

document.getElementById("type-dropdown");


/* =========================
   قراءة Google Sheets
========================= */

Papa.parse(

"https://docs.google.com/spreadsheets/d/e/2PACX-1vR4K8UQ_uSMn_FwrdBwl43fTGnkjQtSyL7POpEwefMyz1lEpNJBQ5enZRvrfgYnuXVv_HWpqaRh4zSz/pub?gid=0&single=true&output=csv",

{

download:true,

header:true,

complete:function(results){

students =

results.data

.map(student => ({

name:

student.name?.trim(),

phone:

student.phone?.trim(),

id:

student.id?.trim(),

stage:

student.stage?.trim()

}))

.filter(student =>

student.name

);


renderStudents();

}

}

);


/* =========================
   إغلاق جميع القوائم
========================= */

function closeAllDropdowns(){

stageDropdown.classList.remove("show");

studentDropdown.classList.remove("show");

typeDropdown.classList.remove("show");

}


/* =========================
   المرحلة
========================= */

stageArrow.addEventListener(

"click",

function(event){

event.stopPropagation();

const wasOpen =

stageDropdown.classList.contains("show");

closeAllDropdowns();

if(!wasOpen){

stageDropdown.classList.add("show");

}

}

);


/* اختيار المرحلة */

document

.querySelectorAll(

"#stage-dropdown .dropdown-option"

)

.forEach(option => {

option.addEventListener(

"click",

function(){

stageInput.value =

this.dataset.value;


/* مسح الطالبة */

studentInput.value = "";

studentFilter.value = "";


/* تحديث أسماء الطالبات */

renderStudents();


closeAllDropdowns();

}

);

});


/* =========================
   قائمة الطالبات
========================= */

function renderStudents(){

const selectedStage =

stageInput.value.trim();


const searchText =

studentFilter.value

.trim()

.toLowerCase();


studentList.innerHTML = "";


/* إذا لم تختاري مرحلة */

if(!selectedStage){

studentList.innerHTML =

'<div class="no-students">اختاري المرحلة أولاً</div>';

return;

}


/* الطالبات حسب المرحلة */

let filtered =

students.filter(student =>

student.stage === selectedStage

);


/* البحث بالاسم */

if(searchText){

filtered =

filtered.filter(student =>

student.name

.toLowerCase()

.includes(searchText)

);

}


/* لا توجد نتائج */

if(filtered.length === 0){

studentList.innerHTML =

'<div class="no-students">لا توجد طالبة بهذا الاسم</div>';

return;

}


/* عرض الأسماء */

filtered.forEach(student => {

const option =

document.createElement("div");


option.className =

"student-option";


option.textContent =

student.name;


option.addEventListener(

"click",

function(){

studentInput.value =

student.name;

studentFilter.value = "";

studentDropdown.classList.remove("show");

}

);


studentList.appendChild(option);

});

}


/* =========================
   فتح قائمة الطالبات
========================= */

studentArrow.addEventListener(

"click",

function(event){

event.stopPropagation();


if(!stageInput.value.trim()){

alert("اختاري المرحلة أولاً");

return;

}


const wasOpen =

studentDropdown.classList.contains("show");


closeAllDropdowns();


if(!wasOpen){

studentFilter.value = "";

renderStudents();

studentDropdown.classList.add("show");

}

});


/* =========================
   الكتابة باسم الطالبة
========================= */

studentInput.addEventListener(

"input",

function(){

/*

الكتابة هنا حرة بالكامل

*/

studentFilter.value =

studentInput.value;


renderStudents();

studentDropdown.classList.add("show");

});


/* =========================
   الضغط على خانة الطالبة
========================= */

studentInput.addEventListener(

"focus",

function(){

if(stageInput.value.trim()){

closeAllDropdowns();

renderStudents();

studentDropdown.classList.add("show");

}

});


/* =========================
   البحث داخل القائمة
========================= */

studentFilter.addEventListener(

"input",

function(){

renderStudents();

});


/* =========================
   سبب الإرسال
========================= */

typeArrow.addEventListener(

"click",

function(event){

event.stopPropagation();

const wasOpen =

typeDropdown.classList.contains("show");

closeAllDropdowns();

if(!wasOpen){

typeDropdown.classList.add("show");

}

});


/* اختيار السبب */

document

.querySelectorAll(

"#type-dropdown .dropdown-option"

)

.forEach(option => {

option.addEventListener(

"click",

function(){

typeInput.value =

this.dataset.value;

closeAllDropdowns();

}

);

});


/* =========================
   إغلاق القوائم عند الضغط خارجها
========================= */

document.addEventListener(

"click",

function(event){

if(

!event.target.closest(".search-box")

){

closeAllDropdowns();

}

});


/* =========================
   عداد اليوم
========================= */

const today =

new Date().toLocaleDateString();


const savedDate =

localStorage.getItem("todayDate");


if(savedDate !== today){

localStorage.setItem(

"todayDate",

today

);

localStorage.setItem(

"todayCount",

0

);

}


/* =========================
   تحميل الإحصائيات
========================= */

document.getElementById(

"today-count"

).innerText =

localStorage.getItem(

"todayCount"

) || 0;


document.getElementById(

"first-count"

).innerText =

localStorage.getItem(

"firstCount"

) || 0;


document.getElementById(

"second-count"

).innerText =

localStorage.getItem(

"secondCount"

) || 0;


document.getElementById(

"third-count"

).innerText =

localStorage.getItem(

"thirdCount"

) || 0;


/* =========================
   تحديث الإحصائيات
========================= */

function updateStats(stage){

let first =

Number(

localStorage.getItem("firstCount")

) || 0;


let second =

Number(

localStorage.getItem("secondCount")

) || 0;


let third =

Number(

localStorage.getItem("thirdCount")

) || 0;


let todayCount =

Number(

localStorage.getItem("todayCount")

) || 0;


if(stage === "أول ثانوي"){

first++;

localStorage.setItem(

"firstCount",

first

);

}

else if(stage === "ثاني ثانوي"){

second++;

localStorage.setItem(

"secondCount",

second

);

}

else if(stage === "ثالث ثانوي"){

third++;

localStorage.setItem(

"thirdCount",

third

);

}


todayCount++;


localStorage.setItem(

"todayCount",

todayCount

);


document.getElementById(

"today-count"

).innerText =

todayCount;


document.getElementById(

"first-count"

).innerText =

localStorage.getItem(

"firstCount"

) || 0;


document.getElementById(

"second-count"

).innerText =

localStorage.getItem(

"secondCount"

) || 0;


document.getElementById(

"third-count"

).innerText =

localStorage.getItem(

"thirdCount"

) || 0;

}


/* =========================
   إنشاء الرسالة
========================= */

function createMessage(student,type){

let message = "";


if(type === "غياب"){

message =

`شريك النجاح ولي الأمر،

نأمل إبلاغكم بأن الطالبة ${student.name}
قد تغيبت اليوم عن المدرسة.

يرجى تزويدنا بالعذر.

شاكرين تعاونكم،

متوسطة وثانوية الأندلس الأهلية.`;

}


else if(type === "تأخر"){

message =

`نود إشعاركم بتأخر الطالبة
${student.name} عن الحضور اليوم.

شاكرين تعاونكم،

متوسطة وثانوية الأندلس الأهلية.`;

}


else if(type === "مخالفة"){

message =

`السلام عليكم ورحمة الله وبركاته

ولي أمر الطالبة ${student.name}

نحيطكم علمًا بأن الطالبة قد قامت بمخالفة التعليمات المدرسية.

نأمل منكم مراجعة المدرسة في أقرب وقت.

شاكرين تعاونكم.

متوسطة وثانوية الأندلس الأهلية`;

}


else{

message =

`كل الشكر والتقدير لكم على متابعتكم واهتمامكم بطالبتنا
${student.name}

دعمكم واهتمامكم هو أساس تميزنا.

متوسطة وثانوية الأندلس الأهلية

شكرًا لكم.`;

}


return message;

}


/* =========================
   الإرسال
========================= */

function send(){

const name =

studentInput.value.trim();


const type =

typeInput.value.trim();


const student =

students.find(

s => s.name === name

);


/* التأكد من الطالبة */

if(!student){

alert(

"اختاري الطالبة أولاً"

);

return;

}


/* التأكد من السبب */

if(!type){

alert(

"اختاري سبب الإرسال"

);

return;

}


/* إنشاء الرسالة */

const message =

createMessage(

student,

type

);


/* تحديث الإحصائيات */

updateStats(

student.stage

);


/* تسجيل البيانات */

fetch(

"https://script.google.com/macros/s/AKfycbwf5tlZTlcEzcruKF2vK4gMIoqCxKYZiRDJNrEN1HnvYwEWu7Mn3WTbWMWUhdYXPcxFAw/exec",

{

method:"POST",

body:JSON.stringify({

name:

student.name,

stage:

student.stage,

type:

type

})

}

);


/* رقم الجوال */

const phone =

String(

student.phone || ""

)

.replace(

/[^0-9]/g,

""

);


/* رابط واتساب */

const url =

"https://api.whatsapp.com/send?phone="

+

phone

+

"&text="

+

encodeURIComponent(

message

);


/* فتح واتساب */

window.open(

url,

"_blank"

);

}

</script>

</body>

</html>
