<!DOCTYPE html>
<html lang="ar">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام التواصل مع أولياء الأمور</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>

<style>

*{
box-sizing:border-box;
}

body{

margin:0;

font-family:"Cairo",sans-serif;

direction:rtl;

text-align:center;

min-height:100vh;

overflow-x:hidden;

background-image:
linear-gradient(
rgba(255,255,255,0.285),
rgba(255,255,255,0.158)
),
url("https://lh3.googleusercontent.com/d/1EfrMWJS_ZlookD8ZiZE7krk_6x_bkwez");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

background-attachment:fixed;

}


/* الطبقة الرئيسية */

.overlay{

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:40px 20px;

}


/* اللوقو */

.logo{

width:170px;

max-width:30vw;

margin-bottom:20px;

}


/* العنوان */

h1{

color:#1f3c88;

font-size:clamp(32px,6vw,72px);

line-height:1.3;

margin-bottom:30px;

padding:0 10px;

}


/* الصناديق */

.container,
.stats-container{

width:min(92vw,520px);

background:rgba(255,255,255,0.482);

padding:30px;

border-radius:28px;

box-shadow:0 10px 35px rgba(0,0,0,0.12);

backdrop-filter:blur(6px);

}

.stats-container{

margin-top:20px;

}


/* =========================================
   الخانات
========================================= */

.search-box{

position:relative;

margin-bottom:18px;

width:100%;

}


/* الأيقونة */

.icon{

position:absolute;

right:16px;

top:50%;

transform:translateY(-50%);

font-size:18px;

color:#1f3c88;

z-index:5;

pointer-events:none;

}


/* الخانة */

.combo-input{

width:100%;

height:60px;

border-radius:16px;

border:1px solid #d7d7d7;

padding-right:55px;

padding-left:55px;

font-size:17px;

font-family:"Cairo",sans-serif;

background:white;

direction:rtl;

text-align:right;

outline:none;

}


/* عند الضغط */

.combo-input:focus{

border-color:#1f3c88;

box-shadow:0 0 10px rgba(31,60,136,0.15);

}


/* =========================================
   السهم الثابت
========================================= */

.combo-arrow{

position:absolute;

left:10px;

top:50%;

transform:translateY(-50%);

width:42px;

height:42px;

border:none;

border-radius:12px;

background:transparent;

color:#1f3c88;

font-size:22px;

font-weight:bold;

cursor:pointer;

z-index:10;

margin:0;

padding:0;

display:flex;

align-items:center;

justify-content:center;

}


/* عند الضغط على السهم */

.combo-arrow:hover{

background:#f0f3ff;

transform:translateY(-50%);

box-shadow:none;

}


/* =========================================
   القائمة
========================================= */

.combo-list{

display:none;

position:absolute;

top:66px;

right:0;

left:0;

background:white;

border-radius:18px;

box-shadow:0 10px 30px rgba(0,0,0,0.15);

border:1px solid #e1e1e1;

max-height:250px;

overflow-y:auto;

z-index:100;

padding:8px;

}


/* تظهر القائمة */

.combo-list.show{

display:block;

}


/* عناصر القائمة */

.combo-option{

padding:13px 15px;

font-size:17px;

border-radius:12px;

cursor:pointer;

text-align:right;

color:#333;

}


/* عند المرور */

.combo-option:hover{

background:#f1f3ff;

color:#1f3c88;

}


/* لا توجد طالبات */

.no-results{

padding:14px;

color:#888;

font-size:15px;

}


/* =========================================
   الزر
========================================= */

button.send-button{

width:100%;

height:60px;

border:none;

border-radius:16px;

background:#1f3c88;

color:white;

font-size:20px;

font-family:"Cairo",sans-serif;

font-weight:bold;

cursor:pointer;

transition:0.25s;

margin-top:10px;

}

button.send-button:hover{

background:#6c3eb7;

transform:translateY(-2px);

box-shadow:0 8px 18px rgba(108,62,183,0.25);

}


/* =========================================
   رسائل اليوم
========================================= */

.today-box{

background:#f8f8ff;

padding:18px;

border-radius:20px;

margin-bottom:18px;

font-size:22px;

font-weight:bold;

color:#1f3c88;

}


#today-count{

color:#6c3eb7;

font-size:34px;

}


/* =========================================
   الإحصائيات
========================================= */

.stats-box{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:14px;

}


.stat-card{

background:#f8f8ff;

padding:18px 10px;

border-radius:18px;

box-shadow:0 5px 12px rgba(0,0,0,0.05);

}


.stat-card h3{

margin:0;

font-size:15px;

color:#1f3c88;

}


.stat-card p{

margin-top:10px;

font-size:30px;

font-weight:bold;

color:#6c3eb7;

}


/* =========================================
   الفوتر
========================================= */

.footer{

margin-top:25px;

font-size:14px;

color:#444;

padding-bottom:15px;

}


/* =========================================
   الجوال
========================================= */

@media(max-width:600px){

.overlay{

padding:25px 14px;

}

.logo{

width:170px;

max-width:45vw;

}

h1{

font-size:40px;

margin-bottom:25px;

}

.container,
.stats-container{

padding:22px;

border-radius:24px;

width:94vw;

}

.combo-input{

height:58px;

font-size:16px;

padding-right:52px;

padding-left:50px;

}

.combo-arrow{

width:40px;

height:40px;

font-size:21px;

}

.combo-list{

top:64px;

max-height:260px;

}

.combo-option{

font-size:16px;

padding:14px;

}

button.send-button{

height:56px;

font-size:18px;

}

.stats-box{

grid-template-columns:1fr;

}

}


/* =========================================
   الشاشات الكبيرة
========================================= */

@media(min-width:1400px){

.container,
.stats-container{

max-width:600px;

}

h1{

font-size:78px;

}

}

</style>

</head>


<body>


<div class="overlay">


<!-- اللوقو -->

<img

src="https://lh3.googleusercontent.com/d/1M2HSqXpnuZrGR_KJFeiIypmAepALG9bh"

class="logo"


>


<!-- العنوان -->

<h1>

التواصل مع شركاء النجاح

</h1>



<!-- =========================================
     صندوق الإرسال
========================================= -->

<div class="container">



<!-- =========================================
     المرحلة
========================================= -->

<div class="search-box">

<span class="icon">

📚

</span>


<input

type="text"

id="stage"

class="combo-input"

placeholder="اختاري المرحلة"

autocomplete="off"


>


<button

type="button"

class="combo-arrow"

onclick="toggleList('stage-list')"

>

▼

</button>


<div

id="stage-list"

class="combo-list"


>

<div

class="combo-option"

onclick="selectStage('أول ثانوي')"

>

أول ثانوي

</div>


<div

class="combo-option"

onclick="selectStage('ثاني ثانوي')"

>

ثاني ثانوي

</div>


<div

class="combo-option"

onclick="selectStage('ثالث ثانوي')"

>

ثالث ثانوي

</div>


</div>

</div>



<!-- =========================================
     الطالبة
========================================= -->

<div class="search-box">

<span class="icon">

🔎

</span>


<input

type="text"

id="search"

class="combo-input"

placeholder="ابحثي عن الطالبة"

autocomplete="off"


>


<button

type="button"

class="combo-arrow"

onclick="toggleStudentList()"

>

▼

</button>


<div

id="student-list"

class="combo-list"

>

<div class="no-results">

اختاري المرحلة أولاً

</div>

</div>

</div>



<!-- =========================================
     سبب الإرسال
========================================= -->

<div class="search-box">

<span class="icon">

📩

</span>


<input

type="text"

id="type"

class="combo-input"

placeholder="سبب الإرسال"

autocomplete="off"


>


<button

type="button"

class="combo-arrow"

onclick="toggleList('type-list')"

>

▼

</button>


<div

id="type-list"

class="combo-list"

>


<div

class="combo-option"

onclick="selectType('غياب')"

>

غياب

</div>


<div

class="combo-option"

onclick="selectType('تأخر')"

>

تأخر

</div>


<div

class="combo-option"

onclick="selectType('شكر')"

>

شكر

</div>


<div

class="combo-option"

onclick="selectType('مخالفة')"

>

مخالفة

</div>


</div>

</div>



<!-- الزر -->

<button

class="send-button"

onclick="send()"

>

إرسال الرسالة

</button>


</div>



<!-- =========================================
     الإحصائيات
========================================= -->

<div class="stats-container">


<div class="today-box">

📅 رسائل اليوم:

<span id="today-count">

0

</span>

</div>


<div class="stats-box">


<div class="stat-card">

<h3>

أول ثانوي

</h3>

<p id="first-count">

0

</p>

</div>


<div class="stat-card">

<h3>

ثاني ثانوي

</h3>

<p id="second-count">

0

</p>

</div>


<div class="stat-card">

<h3>

ثالث ثانوي

</h3>

<p id="third-count">

0

</p>

</div>


</div>

</div>



<!-- الفوتر -->

<div class="footer">

متوسطة وثانوية الأندلس الأهلية بالطائف - بنات

</div>


</div>



<script>


/* =========================================
   بيانات الطالبات
========================================= */

let students = [];



/* =========================================
   قراءة Google Sheets
========================================= */

Papa.parse(

"https://docs.google.com/spreadsheets/d/e/2PACX-1vR4K8UQ_uSMn_FwrdBwl43fTGnkjQtSyL7POpEwefMyz1lEpNJBQ5enZRvrfgYnuXVv_HWpqaRh4zSz/pub?gid=0&single=true&output=csv",

{

download:true,

header:true,

complete:function(results){

students = results.data.map(student => ({

name: student.name?.trim(),

phone: student.phone?.trim(),

id: student.id?.trim(),

stage: student.stage?.trim()

}));


populateStudents();

}

}

);



/* =========================================
   فتح وإغلاق القوائم
========================================= */

function toggleList(id){

const list = document.getElementById(id);

document.querySelectorAll(".combo-list").forEach(item => {

if(item !== list){

item.classList.remove("show");

}

});

list.classList.toggle("show");

}



/* =========================================
   اختيار المرحلة
========================================= */

function selectStage(value){

const input = document.getElementById("stage");

input.value = value;

document.getElementById("stage-list").classList.remove("show");

document.getElementById("search").value = "";

populateStudents();

}



/* =========================================
   تعبئة أسماء الطالبات
========================================= */

function populateStudents(){

const list = document.getElementById("student-list");

const selectedStage = document.getElementById("stage").value.trim();


list.innerHTML = "";


if(!selectedStage){

list.innerHTML = `

<div class="no-results">

اختاري المرحلة أولاً

</div>

`;

return;

}


const filteredStudents = students.filter(student =>

student.stage === selectedStage

);


if(filteredStudents.length === 0){

list.innerHTML = `

<div class="no-results">

لا توجد طالبات لهذه المرحلة

</div>

`;

return;

}


filteredStudents.forEach(student => {

const option = document.createElement("div");

option.className = "combo-option";

option.textContent = student.name;

option.onclick = function(){

selectStudent(student.name);

};

list.appendChild(option);

});

}



/* =========================================
   اختيار الطالبة
========================================= */

function selectStudent(name){

document.getElementById("search").value = name;

document.getElementById("student-list").classList.remove("show");

}



/* =========================================
   فتح قائمة الطالبات
========================================= */

function toggleStudentList(){

const list = document.getElementById("student-list");


document.querySelectorAll(".combo-list").forEach(item => {

if(item !== list){

item.classList.remove("show");

}

});


populateStudents();

list.classList.toggle("show");

}



/* =========================================
   البحث والكتابة باسم الطالبة
========================================= */

document

.getElementById("search")

.addEventListener("input", function(){

const value = this.value.trim().toLowerCase();

const list = document.getElementById("student-list");

const selectedStage = document.getElementById("stage").value.trim();


if(!selectedStage){

return;

}


const filteredStudents = students.filter(student =>

student.stage === selectedStage &&

student.name.toLowerCase().includes(value)

);


list.innerHTML = "";


if(filteredStudents.length === 0){

list.innerHTML = `

<div class="no-results">

لا توجد طالبة بهذا الاسم

</div>

`;

return;

}


filteredStudents.forEach(student => {

const option = document.createElement("div");

option.className = "combo-option";

option.textContent = student.name;

option.onclick = function(){

selectStudent(student.name);

};

list.appendChild(option);

});


list.classList.add("show");

});



/* =========================================
   اختيار سبب الإرسال
========================================= */

function selectType(value){

document.getElementById("type").value = value;

document.getElementById("type-list").classList.remove("show");

}



/* =========================================
   تحميل عداد اليوم
========================================= */

const today = new Date().toLocaleDateString();

const savedDate = localStorage.getItem("todayDate");


if(savedDate !== today){

localStorage.setItem("todayDate", today);

localStorage.setItem("todayCount", 0);

}



/* =========================================
   تحميل الإحصائيات
========================================= */

document.getElementById("today-count").innerText =

localStorage.getItem("todayCount") || 0;


document.getElementById("first-count").innerText =

localStorage.getItem("firstCount") || 0;


document.getElementById("second-count").innerText =

localStorage.getItem("secondCount") || 0;


document.getElementById("third-count").innerText =

localStorage.getItem("thirdCount") || 0;



/* =========================================
   تحديث الإحصائيات
========================================= */

function updateStats(stage){

let first =

Number(localStorage.getItem("firstCount")) || 0;


let second =

Number(localStorage.getItem("secondCount")) || 0;


let third =

Number(localStorage.getItem("thirdCount")) || 0;


let todayCount =

Number(localStorage.getItem("todayCount")) || 0;



if(stage === "أول ثانوي"){

first++;

localStorage.setItem("firstCount", first);

}


else if(stage === "ثاني ثانوي"){

second++;

localStorage.setItem("secondCount", second);

}


else if(stage === "ثالث ثانوي"){

third++;

localStorage.setItem("thirdCount", third);

}


todayCount++;

localStorage.setItem("todayCount", todayCount);


document.getElementById("today-count").innerText = todayCount;


document.getElementById("first-count").innerText =

localStorage.getItem("firstCount") || 0;


document.getElementById("second-count").innerText =

localStorage.getItem("secondCount") || 0;


document.getElementById("third-count").innerText =

localStorage.getItem("thirdCount") || 0;

}



/* =========================================
   الإرسال
========================================= */

function send(){


const name =

document.getElementById("search").value.trim();


const type =

document.getElementById("type").value.trim();


const stage =

document.getElementById("stage").value.trim();



/* التأكد من المرحلة */

if(!stage){

alert("اختاري المرحلة أولاً");

return;

}



/* التأكد من الطالبة */

const student = students.find(s =>

s.name === name &&

s.stage === stage

);


if(!student){

alert("اختاري الطالبة أولاً");

return;

}



/* التأكد من السبب */

if(!type){

alert("اختاري سبب الإرسال");

return;

}



let message = "";



/* =========================================
   غياب
========================================= */

if(type === "غياب"){

message =

`شريك النجاح ولي الأمر،

نأمل إبلاغكم بأن الطالبة ${student.name}
قد تغيبت اليوم عن المدرسة.

يرجى تزويدنا بالعذر.

شاكرين تعاونكم،

متوسطة وثانوية الأندلس الأهلية.`;

}



/* =========================================
   تأخر
========================================= */

else if(type === "تأخر"){

message =

`نود إشعاركم بتأخر الطالبة
${student.name} عن الحضور اليوم.

شاكرين تعاونكم،

متوسطة وثانوية الأندلس الأهلية.`;

}



/* =========================================
   مخالفة
========================================= */

else if(type === "مخالفة"){

message =

`السلام عليكم ورحمة الله وبركاته

ولي أمر الطالبة ${student.name}

نحيطكم علمًا بأن الطالبة قد قامت بمخالفة التعليمات المدرسية.

نأمل منكم مراجعة المدرسة في أقرب وقت.

شاكرين تعاونكم.

متوسطة وثانوية الأندلس الأهلية`;

}



/* =========================================
   شكر
========================================= */

else if(type === "شكر"){

message =

`كل الشكر والتقدير لكم على متابعتكم واهتمامكم بطالبتنا
${student.name}

دعمكم واهتمامكم هو أساس تميزنا.

متوسطة وثانوية الأندلس الأهلية

شكرًا لكم.`;

}



/* تحديث الإحصائيات */

updateStats(student.stage);



/* =========================================
   تسجيل الإرسال في Google Apps Script
========================================= */

fetch(

"https://script.google.com/macros/s/AKfycbwf5tlZTlcEzcruKF2vK4gMIoqCxKYZiRDJNrEN1HnvYwEWu7Mn3WTbWMWUhdYXPcxFAw/exec",

{

method:"POST",

body:JSON.stringify({

name:student.name,

stage:student.stage,

type:type

})

}

);



/* =========================================
   فتح واتساب
========================================= */

const url =

"https://api.whatsapp.com/send?phone="

+

student.phone

+

"&text="

+

encodeURIComponent(message);



window.open(url,"_blank");


}



/* =========================================
   تغيير المرحلة بالكتابة
========================================= */

document

.getElementById("stage")

.addEventListener("input", function(){

document.getElementById("search").value = "";

populateStudents();

});



/* =========================================
   إغلاق القوائم عند الضغط خارجها
========================================= */

document.addEventListener("click", function(event){

if(!event.target.closest(".search-box")){

document.querySelectorAll(".combo-list").forEach(list => {

list.classList.remove("show");

});

}

});


</script>


</body>

</html>
