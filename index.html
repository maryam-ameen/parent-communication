<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>نظام التواصل مع أولياء الأمور</title>

<link
href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap"
rel="stylesheet">

<script
src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js">
</script>


<style>

/* =========================
   الأساسيات
========================= */

*{
box-sizing:border-box;
}


body{

margin:0;

font-family:"Cairo",sans-serif;

direction:rtl;

text-align:center;

min-height:100vh;

overflow-x:hidden;

background-image:

linear-gradient(
rgba(255,255,255,0.285),
rgba(255,255,255,0.158)
),

url("https://lh3.googleusercontent.com/d/1EfrMWJS_ZlookD8ZiZE7krk_6x_bkwez");

background-size:cover;

background-position:center;

background-repeat:no-repeat;

background-attachment:fixed;

}


/* =========================
   الطبقة الرئيسية
========================= */

.overlay{

min-height:100vh;

display:flex;

flex-direction:column;

justify-content:center;

align-items:center;

padding:40px 20px;

}


/* =========================
   الشعار
========================= */

.logo{

width:170px;

max-width:40vw;

margin-bottom:20px;

}


/* =========================
   العنوان
========================= */

h1{

color:#1f3c88;

font-size:clamp(32px,6vw,72px);

line-height:1.3;

margin:0 0 30px 0;

padding:0 10px;

}


/* =========================
   الصناديق
========================= */

.container,
.stats-container{

width:min(92vw,520px);

background:rgba(255,255,255,0.482);

padding:30px;

border-radius:28px;

box-shadow:

0 10px 35px rgba(0,0,0,0.12);

backdrop-filter:blur(6px);

}


.stats-container{

margin-top:20px;

}


/* =========================
   الحقول
========================= */

.search-box{

position:relative;

width:100%;

margin-bottom:18px;

}


.icon{

position:absolute;

right:16px;

top:50%;

transform:translateY(-50%);

font-size:18px;

color:#1f3c88;

z-index:5;

pointer-events:none;

}


input{

width:100%;

height:60px;

border-radius:16px;

border:1px solid #d7d7d7;

padding-right:50px;

padding-left:45px;

font-size:17px;

font-family:"Cairo",sans-serif;

background:white;

color:#333;

}


input:focus{

outline:none;

border-color:#1f3c88;

box-shadow:

0 0 10px rgba(31,60,136,0.15);

}


/* =========================
   خانة اختيار الطالبات
========================= */

.student-picker{

position:relative;

width:100%;

}


/* مربع الإدخال */

.student-input-box{

position:relative;

width:100%;

}


/* السهم */

.dropdown-arrow{

position:absolute;

left:15px;

top:50%;

transform:translateY(-50%);

font-size:18px;

color:#1f3c88;

cursor:pointer;

z-index:10;

user-select:none;

padding:8px;

}


/* =========================
   القائمة
========================= */

.student-dropdown{

display:none;

position:absolute;

top:65px;

right:0;

left:0;

background:white;

border:1px solid #ddd;

border-radius:16px;

box-shadow:

0 10px 30px rgba(0,0,0,0.15);

z-index:1000;

overflow:hidden;

text-align:right;

}


.student-dropdown.show{

display:block;

}


/* =========================
   البحث داخل القائمة
========================= */

.student-search{

padding:12px;

background:#fafafa;

border-bottom:1px solid #eee;

}


.student-search input{

height:48px;

font-size:15px;

padding-right:15px;

padding-left:15px;

}


/* =========================
   قائمة الأسماء
========================= */

.student-list{

max-height:280px;

overflow-y:auto;

-webkit-overflow-scrolling:touch;

}


.student-item{

padding:13px 18px;

font-size:15px;

cursor:pointer;

border-bottom:1px solid #f1f1f1;

background:white;

transition:background 0.15s;

}


.student-item:hover{

background:#f4f5ff;

}


.student-item.selected{

background:#eef0ff;

color:#1f3c88;

font-weight:bold;

}


.student-item.selected::before{

content:"✓";

float:left;

font-size:18px;

color:#6c3eb7;

}


/* لا توجد طالبات */

.no-students{

padding:20px;

text-align:center;

color:#777;

font-size:14px;

}


/* =========================
   الطالبات المختارات
========================= */

.selected-students{

display:flex;

flex-wrap:wrap;

gap:8px;

margin-top:10px;

margin-bottom:5px;

justify-content:flex-start;

}


.selected-student{

display:flex;

align-items:center;

gap:6px;

background:#f0efff;

color:#1f3c88;

border-radius:20px;

padding:6px 11px;

font-size:13px;

font-weight:600;

}


.remove-student{

cursor:pointer;

color:#6c3eb7;

font-size:18px;

font-weight:bold;

line-height:1;

}


/* =========================
   الزر
========================= */

button{

width:100%;

height:60px;

border:none;

border-radius:16px;

background:#1f3c88;

color:white;

font-size:20px;

font-family:"Cairo",sans-serif;

font-weight:bold;

cursor:pointer;

transition:0.25s;

margin-top:10px;

}


button:hover{

background:#6c3eb7;

transform:translateY(-2px);

box-shadow:

0 8px 18px rgba(108,62,183,0.25);

}


/* =========================
   رسائل اليوم
========================= */

.today-box{

background:#f8f8ff;

padding:18px;

border-radius:20px;

margin-bottom:18px;

font-size:22px;

font-weight:bold;

color:#1f3c88;

}


#today-count{

color:#6c3eb7;

font-size:34px;

}


/* =========================
   الإحصائيات
========================= */

.stats-box{

display:grid;

grid-template-columns:repeat(3,1fr);

gap:14px;

}


.stat-card{

background:#f8f8ff;

padding:18px 10px;

border-radius:18px;

box-shadow:

0 5px 12px rgba(0,0,0,0.05);

}


.stat-card h3{

margin:0;

font-size:15px;

color:#1f3c88;

}


.stat-card p{

margin-top:10px;

font-size:30px;

font-weight:bold;

color:#6c3eb7;

}


/* =========================
   الفوتر
========================= */

.footer{

margin-top:25px;

font-size:14px;

color:#444;

padding-bottom:15px;

}


/* =========================
   الجوال
========================= */

@media(max-width:600px){

.overlay{

padding:25px 14px;

}


.logo{

width:170px;

max-width:55vw;

}


h1{

font-size:40px;

line-height:1.35;

margin-bottom:25px;

}


.container,
.stats-container{

width:94vw;

padding:22px;

border-radius:24px;

}


input{

height:56px;

font-size:16px;

}


button{

height:56px;

font-size:17px;

}


.student-dropdown{

top:62px;

}


.student-list{

max-height:260px;

}


.student-item{

padding:13px 15px;

font-size:14px;

}


.stats-box{

grid-template-columns:1fr;

}

}


/* =========================
   الشاشات الكبيرة
========================= */

@media(min-width:1400px){

.container,
.stats-container{

max-width:600px;

}


h1{

font-size:78px;

}

}

</style>

</head>


<body>


<div class="overlay">


<!-- =========================
     الشعار
========================= -->

<img

src="https://lh3.googleusercontent.com/d/1M2HSqXpnuZrGR_KJFeiIypmAepALG9bh"

class="logo"

>


<!-- =========================
     العنوان
========================= -->

<h1>

التواصل مع شركاء النجاح

</h1>


<!-- =========================
     صندوق الإرسال
========================= -->

<div class="container">


<!-- =========================
     المرحلة
========================= -->

<div class="search-box">

<span class="icon">📚</span>

<input

list="stage-list"

id="stage"

placeholder="اختاري المرحلة"

autocomplete="off"

>

</div>


<datalist id="stage-list">

<option value="أول ثانوي">

<option value="ثاني ثانوي">

<option value="ثالث ثانوي">

</datalist>


<!-- =========================
     اختيار الطالبات
========================= -->

<div class="search-box student-picker">


<div class="student-input-box">


<span class="icon">

🔎

</span>


<input

id="studentInput"

placeholder="اكتبي اسم الطالبة أو اختاري من السهم"

autocomplete="off"

>


<span

class="dropdown-arrow"

id="dropdownArrow"

>

▼

</span>


</div>


<!-- =========================
     القائمة المنسدلة
========================= -->

<div

class="student-dropdown"

id="studentDropdown"

>


<!-- البحث داخل القائمة -->

<div class="student-search">

<input

id="studentSearch"

placeholder="ابحثي عن الطالبة"

autocomplete="off"

>

</div>


<!-- قائمة الطالبات -->

<div

class="student-list"

id="studentList"

>

<div class="no-students">

اختاري المرحلة أولاً

</div>

</div>


</div>


<!-- =========================
     الطالبات المختارات
========================= -->

<div

class="selected-students"

id="selectedStudents"

></div>


</div>


<!-- =========================
     سبب الإرسال
========================= -->

<div class="search-box">

<span class="icon">

📩

</span>

<input

list="type-list"

id="type"

placeholder="سبب الإرسال"

autocomplete="off"

>

</div>


<datalist id="type-list">

<option value="غياب">

<option value="تأخر">

<option value="شكر">

<option value="مخالفة">

</datalist>


<!-- =========================
     زر الإرسال
========================= -->

<button onclick="send()">

إرسال الرسالة

</button>


</div>


<!-- =========================
     الإحصائيات
========================= -->

<div class="stats-container">


<div class="today-box">

📅 رسائل اليوم:

<span id="today-count">

0

</span>

</div>


<div class="stats-box">


<div class="stat-card">

<h3>

أول ثانوي

</h3>

<p id="first-count">

0

</p>

</div>


<div class="stat-card">

<h3>

ثاني ثانوي

</h3>

<p id="second-count">

0

</p>

</div>


<div class="stat-card">

<h3>

ثالث ثانوي

</h3>

<p id="third-count">

0

</p>

</div>


</div>

</div>


<!-- =========================
     الفوتر
========================= -->

<div class="footer">

متوسطة وثانوية الأندلس الأهلية بالطائف - بنات

</div>


</div>


<script>


/* =========================
   البيانات
========================= */

let students = [];

let selectedStudents = [];


/* =========================
   عناصر الصفحة
========================= */

const stageInput =

document.getElementById("stage");


const studentInput =

document.getElementById("studentInput");


const studentSearch =

document.getElementById("studentSearch");


const studentDropdown =

document.getElementById("studentDropdown");


const studentList =

document.getElementById("studentList");


const selectedStudentsBox =

document.getElementById("selectedStudents");


const dropdownArrow =

document.getElementById("dropdownArrow");


/* =========================
   تحميل بيانات Google Sheets
========================= */

Papa.parse(

"https://docs.google.com/spreadsheets/d/e/2PACX-1vR4K8UQ_uSMn_FwrdBwl43fTGnkjQtSyL7POpEwefMyz1lEpNJBQ5enZRvrfgYnuXVv_HWpqaRh4zSz/pub?gid=0&single=true&output=csv",

{

download:true,

header:true,

complete:function(results){

students =

results.data

.map(student => ({

name:

student.name
?.trim(),

phone:

student.phone
?.trim(),

id:

student.id
?.trim(),

stage:

student.stage
?.trim()

}))

.filter(student =>

student.name

);


/* مهم جدًا */

renderStudentList();

}

}

);


/* =========================
   تغيير المرحلة
========================= */

stageInput.addEventListener(

"input",

function(){

selectedStudents = [];

renderSelectedStudents();

studentInput.value = "";

studentSearch.value = "";

renderStudentList();

}

);


stageInput.addEventListener(

"change",

function(){

selectedStudents = [];

renderSelectedStudents();

studentInput.value = "";

studentSearch.value = "";

renderStudentList();

}

);


/* =========================
   فتح القائمة
========================= */

function openStudentDropdown(){

studentDropdown.classList.add("show");

studentSearch.value = "";

renderStudentList();

}


/* =========================
   السهم
========================= */

dropdownArrow.addEventListener(

"click",

function(event){

event.stopPropagation();


if(

studentDropdown.classList.contains("show")

){

studentDropdown.classList.remove("show");

}

else{

openStudentDropdown();

}

}

);


/* =========================
   الضغط على خانة الطالب
========================= */

studentInput.addEventListener(

"focus",

function(){

openStudentDropdown();

}

);


/* =========================
   الكتابة في خانة الطالب
========================= */

studentInput.addEventListener(

"input",

function(){

const text =

studentInput.value.trim();


studentDropdown.classList.add("show");


studentSearch.value = text;


renderStudentList();

}

);


/* =========================
   البحث داخل القائمة
========================= */

studentSearch.addEventListener(

"input",

function(){

renderStudentList();

}

);


/* =========================
   عرض قائمة الطالبات
========================= */

function renderStudentList(){


const selectedStage =

stageInput.value.trim();


const searchText =

studentSearch.value

.trim()

.toLowerCase();


studentList.innerHTML = "";


/* لا توجد مرحلة */

if(!selectedStage){

studentList.innerHTML =

'<div class="no-students">اختاري المرحلة أولاً</div>';

return;

}


/* فلترة المرحلة */

let filteredStudents =

students.filter(student =>

student.stage === selectedStage

);


/* البحث بالاسم */

if(searchText){

filteredStudents =

filteredStudents.filter(student =>

student.name

.toLowerCase()

.includes(searchText)

);

}


/* لا توجد نتائج */

if(filteredStudents.length === 0){

studentList.innerHTML =

'<div class="no-students">لا توجد طالبة بهذا الاسم</div>';

return;

}


/* عرض الطالبات */

filteredStudents.forEach(student => {


const item =

document.createElement("div");


item.className =

"student-item";


/* هل مختارة؟ */

if(

selectedStudents.some(

s => s.id === student.id

)

){

item.classList.add("selected");

}


item.textContent =

student.name;


/* الضغط */

item.addEventListener(

"click",

function(event){

event.stopPropagation();

toggleStudent(student);

}

);


studentList.appendChild(item);

});

}


/* =========================
   اختيار أو إلغاء طالبة
========================= */

function toggleStudent(student){


const existingIndex =

selectedStudents.findIndex(

s =>

s.id === student.id

);


if(existingIndex !== -1){

/* إلغاء */

selectedStudents.splice(

existingIndex,

1

);

}

else{

/* إضافة */

selectedStudents.push(student);

}


/* تحديث */

renderSelectedStudents();

renderStudentList();


/* تنظيف البحث */

studentInput.value = "";

studentSearch.value = "";

}


/* =========================
   عرض الطالبات المختارات
========================= */

function renderSelectedStudents(){


selectedStudentsBox.innerHTML = "";


selectedStudents.forEach(student => {


const tag =

document.createElement("div");


tag.className =

"selected-student";


const name =

document.createElement("span");


name.textContent =

student.name;


const remove =

document.createElement("span");


remove.className =

"remove-student";


remove.textContent =

"×";


remove.addEventListener(

"click",

function(event){

event.stopPropagation();


selectedStudents =

selectedStudents.filter(

s =>

s.id !== student.id

);


renderSelectedStudents();

renderStudentList();

}

);


tag.appendChild(name);

tag.appendChild(remove);


selectedStudentsBox.appendChild(tag);

});

}


/* =========================
   إغلاق القائمة
========================= */

document.addEventListener(

"click",

function(event){

if(

!event.target.closest(

".student-picker"

)

){

studentDropdown.classList.remove("show");

}

});


/* =========================
   عداد اليوم
========================= */

const today =

new Date().toLocaleDateString();


const savedDate =

localStorage.getItem("todayDate");


if(savedDate !== today){

localStorage.setItem(

"todayDate",

today

);

localStorage.setItem(

"todayCount",

0

);

}


/* =========================
   تحميل الإحصائيات
========================= */

document.getElementById(

"today-count"

).innerText =

localStorage.getItem(

"todayCount"

) || 0;


document.getElementById(

"first-count"

).innerText =

localStorage.getItem(

"firstCount"

) || 0;


document.getElementById(

"second-count"

).innerText =

localStorage.getItem(

"secondCount"

) || 0;


document.getElementById(

"third-count"

).innerText =

localStorage.getItem(

"thirdCount"

) || 0;


/* =========================
   تحديث الإحصائيات
========================= */

function updateStats(stage){


let first =

Number(

localStorage.getItem(

"firstCount"

)

) || 0;


let second =

Number(

localStorage.getItem(

"secondCount"

)

) || 0;


let third =

Number(

localStorage.getItem(

"thirdCount"

)

) || 0;


let todayCount =

Number(

localStorage.getItem(

"todayCount"

)

) || 0;


/* أول ثانوي */

if(stage === "أول ثانوي"){

first++;

localStorage.setItem(

"firstCount",

first

);

}


/* ثاني ثانوي */

else if(stage === "ثاني ثانوي"){

second++;

localStorage.setItem(

"secondCount",

second

);

}


/* ثالث ثانوي */

else if(stage === "ثالث ثانوي"){

third++;

localStorage.setItem(

"thirdCount",

third

);

}


/* اليوم */

todayCount++;


localStorage.setItem(

"todayCount",

todayCount

);


/* تحديث الشاشة */

document.getElementById(

"today-count"

).innerText =

todayCount;


document.getElementById(

"first-count"

).innerText =

localStorage.getItem(

"firstCount"

) || 0;


document.getElementById(

"second-count"

).innerText =

localStorage.getItem(

"secondCount"

) || 0;


document.getElementById(

"third-count"

).innerText =

localStorage.getItem(

"thirdCount"

) || 0;

}


/* =========================
   إنشاء الرسالة
========================= */

function createMessage(student,type){


let message = "";


/* غياب */

if(type === "غياب"){

message =

`شريك النجاح ولي الأمر،

نأمل إبلاغكم بأن الطالبة ${student.name}
قد تغيبت اليوم عن المدرسة.

يرجى تزويدنا بالعذر.

شاكرين تعاونكم،

متوسطة وثانوية الأندلس الأهلية.`;

}


/* تأخر */

else if(type === "تأخر"){

message =

`نود إشعاركم بتأخر الطالبة
${student.name} عن الحضور اليوم.

شاكرين تعاونكم،

متوسطة وثانوية الأندلس الأهلية.`;

}


/* مخالفة */

else if(type === "مخالفة"){

message =

`السلام عليكم ورحمة الله وبركاته

ولي أمر الطالبة ${student.name}

نحيطكم علمًا بأن الطالبة قد قامت بمخالفة التعليمات المدرسية.

نأمل منكم مراجعة المدرسة في أقرب وقت.

شاكرين تعاونكم.

متوسطة وثانوية الأندلس الأهلية`;

}


/* شكر */

else if(type === "شكر"){

message =

`كل الشكر والتقدير لكم على متابعتكم واهتمامكم بطالبتنا
${student.name}

دعمكم واهتمامكم هو أساس تميزنا.

متوسطة وثانوية الأندلس الأهلية

شكرًا لكم.`;

}


return message;

}


/* =========================
   الإرسال
========================= */

function send(){


const type =

document.getElementById(

"type"

).value.trim();


const stage =

stageInput.value.trim();


/* المرحلة */

if(!stage){

alert(

"اختاري المرحلة أولاً"

);

return;

}


/* الطالبات */

if(selectedStudents.length === 0){

alert(

"اختاري طالبة واحدة على الأقل"

);

return;

}


/* السبب */

if(!type){

alert(

"اختاري سبب الإرسال"

);

return;

}


/* نسخ القائمة */

const studentsToSend =

[...selectedStudents];


/* =========================
   تحديث الإحصائيات
========================= */

studentsToSend.forEach(

student => {

updateStats(

student.stage

);

}

);


/* =========================
   تسجيل العمليات في Google
========================= */

studentsToSend.forEach(

student => {


fetch(

"https://script.google.com/macros/s/AKfycbwf5tlZTlcEzcruKF2vK4gMIoqCxKYZiRDJNrEN1HnvYwEWu7Mn3WTbWMWUhdYXPcxFAw/exec",

{

method:"POST",

body:JSON.stringify({

name:

student.name,

stage:

student.stage,

type:

type

})

}

);

}

);


/* =========================
   فتح واتساب
========================= */

let currentIndex = 0;


function openNextWhatsApp(){


if(

currentIndex >= studentsToSend.length

){

alert(

"تم تجهيز جميع الرسائل المحددة."

);

return;

}


const student =

studentsToSend[currentIndex];


const message =

createMessage(

student,

type

);


/* رقم ولي الأمر */

const phone =

String(

student.phone || ""

)

.replace(

/[^0-9]/g,

""

);


/* لا يوجد رقم */

if(!phone){

alert(

`لا يوجد رقم جوال مسجل للطالبة: ${student.name}`

);

currentIndex++;

openNextWhatsApp();

return;

}


/* رابط واتساب */

const url =

"https://api.whatsapp.com/send?phone="

+

phone

+

"&text="

+

encodeURIComponent(

message

);


/* فتح */

window.open(

url,

"_blank"

);


currentIndex++;


/* طالبة أخرى */

if(

currentIndex < studentsToSend.length

){


setTimeout(

function(){


const nextStudent =

studentsToSend[currentIndex];


const continueSending =

confirm(

`تم تجهيز رسالة ${student.name}.\n\nهل تريدين الانتقال إلى رسالة ${nextStudent.name}؟`

);


if(continueSending){

openNextWhatsApp();

}

},

700

);

}

}


openNextWhatsApp();


/* =========================
   تنظيف الاختيارات
========================= */

selectedStudents = [];

renderSelectedStudents();

studentInput.value = "";

studentSearch.value = "";

renderStudentList();

}

</script>
